<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Productos | Pastel Plushes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../permisos.js"></script>
  <script src="../../PeluJavas/datos.js"></script>
  <script src="../../PeluJavas/PeluGestion.js" defer></script>
  <style>
    body { background-color: #fdf8f5; color: #4e3629; }
    .btn-cafe-claro { background-color: #e2a584; color: white; }
    .btn-cafe-claro:hover { background-color: #a9825e; color: white; }
    thead { background-color: #D7C4B7; }
  </style>
</head>
<body data-vista="productos" data-requiere="ver_productos">
  <div class="container py-4" id="contenido">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3">Lista de Productos</h1>
      <a href="../../index.html" class="btn btn-cafe-claro">Volver al inicio</a>
    </div>

    <input id="filtro" type="text" class="form-control mb-3" placeholder="Buscar por nombre o categoría...">

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Detalle -->
  <div class="modal fade" id="modal-detalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-titulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="modal-cuerpo"></div>
      </div>
    </div>
  </div>
</body>
</html>
