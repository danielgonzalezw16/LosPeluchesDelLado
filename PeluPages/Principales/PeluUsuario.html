<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - Pastel Plushes</title>
    <link rel="stylesheet" href="../../PeluPrincipalDesign.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../../PeluPrincipalAction.js" defer></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="formulario text-white text-center">
        <h2 class="mb-4">Mi Perfil</h2>
        
        <div class="p-4 mb-3 bg-white text-dark rounded-4 shadow">
            <h4 id="perfilNombre" class="fw-bold mb-2">---</h4>
            <p id="perfilCorreo" class="text-muted mb-0">---</p>
        </div>

        <div class="d-flex flex-column gap-2 mt-4">
            <a href="../../index.html" class="btn btn-cafe-claro">Ir al Inicio</a>
            <button onclick="cerrarSesion()" class="btn btn-danger">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        // Validar si el usuario tiene sesión activa al entrar
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioActivo = JSON.parse(localStorage.getItem("usuarioLogueado"));
            
            if (!usuarioActivo) {
                alert("Debes validar tu usuario primero.");
                window.location.href = "PeluIniciar.html";
            } else {
                document.getElementById("perfilNombre").innerText = usuarioActivo.nombre;
                document.getElementById("perfilCorreo").innerText = usuarioActivo.correo;
            }
        });

        function cerrarSesion() {
            localStorage.removeItem("usuarioLogueado");
            window.location.href = "../../index.html";
        }
    </script>
</body>
</html>
