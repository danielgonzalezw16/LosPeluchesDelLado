        <div class="container d-flex justify-content-center mt-5 mb-5">
            <div class="col-md-9 col-lg-7">
                <form id="formVenta" class="p-4 shadow-lg rounded-4 bg-white" novalidate>
                    <h2 class="text-pastel-cafe text-center mb-4 fw-bold">Carrito de Compras</h2>
                    
                    <h5 class="text-pastel-cafe mb-3 border-bottom pb-2">1. Selecciona tus peluches</h5>
                    
                    <div id="contenedorProductosCarrito" class="mb-4">
                        <p class="text-center text-muted">Cargando carrito...</p>
                    </div>
                    <h5 class="text-pastel-cafe mb-3 border-bottom pb-2">2. Entrega</h5>
                    <div class="mb-4">
                        <div class="mb-3">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipoEntrega" id="entregaDespacho" value="despacho" checked>
                                <label class="form-check-label" for="entregaDespacho">Despacho a domicilio</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipoEntrega" id="entregaRetiro" value="retiro">
                                <label class="form-check-label" for="entregaRetiro">Retiro en sucursal</label>
                            </div>
                        </div>

                        <div id="bloqueDespacho" class="row g-3">
                            <div class="col-md-8">
                                <input type="text" class="form-control shadow-sm" id="dirCalle" placeholder="Calle">
                            </div>
                            <div class="col-md-4">
                                <input type="text" class="form-control shadow-sm" id="dirNumero" placeholder="N° / Depto">
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control shadow-sm" id="dirComuna" placeholder="Comuna">
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control shadow-sm" id="dirCiudad" placeholder="Ciudad">
                            </div>
                            <div class="col-12">
                                <input type="text" class="form-control shadow-sm" id="dirReferencia" placeholder="Referencia (opcional)">
                            </div>
                        </div>

                        <div id="bloqueRetiro" class="d-none">
                            <select class="form-select shadow-sm" id="sucursalRetiro">
                                <option value="" disabled selected>Elige una sucursal</option>
                                <option value="Sucursal 1">Sucursal 1</option>
                                <option value="Sucursal 2">Sucursal 2</option>
                            </select>
                        </div>
                    </div>
                    <h5 class="text-pastel-cafe mb-3 border-bottom pb-2">3. Datos de Pago</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label class="form-label text-secondary fw-semibold">Nombre y Apellido del Titular</label>
                            <input type="text" class="form-control shadow-sm" id="titularTarjeta" placeholder="Nombre tal como aparece en la tarjeta" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary fw-semibold">Tipo de tarjeta</label>
                            <select class="form-select shadow-sm" id="tipoTarjeta" required>
                                <option value="" disabled selected>Seleccione débito o crédito</option>
                                <option value="Débito">Débito</option>
                                <option value="Crédito">Crédito</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label text-secondary fw-semibold">Número de tarjeta</label>
                            <input type="text" class="form-control shadow-sm" id="nroTarjeta" placeholder="1111 1111 1111 1111" maxlength="19" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary fw-semibold">CVV / CVC</label>
                            <input type="password" class="form-control shadow-sm" id="claveCVV" placeholder="123" maxlength="4" required>
                        </div>
                    </div>

                    <div class="card border-0 p-3 mb-3 rounded-3" style="background-color: #f1e9e3;">
                        <div class="d-flex justify-content-between">
                            <span class="text-secondary fw-semibold">Neto:</span>
                            <span class="text-pastel-cafe fw-semibold" id="montoNeto">$0</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-secondary fw-semibold">IVA (19%):</span>
                            <span class="text-pastel-cafe fw-semibold" id="montoIva">$0</span>
                        </div>
                        <hr class="my-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-secondary fw-semibold">Total a pagar (IVA incluido):</span>
                            <h2 class="text-pastel-cafe fw-bold m-0" id="monto
