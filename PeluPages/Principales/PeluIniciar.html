<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Pastel Plushes</title>
    <link rel="stylesheet" href="../../PeluPrincipalDesign.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../../PeluPrincipalAction.js" defer></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <!-- ÚNICO FORMULARIO DE LOGIN -->
    <div class="formulario text-white">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        
        <form id="formLogin" onsubmit="return loginUsuario(event)">
            <!-- Nombre de usuario o correo -->
            <div class="mb-3">
                <label for="correoLogin" class="form-label">Nombre de Usuario o Correo</label>
                <div class="input-box">
                    <input type="text" id="correoLogin" class="form-control" placeholder="Ingresa tu usuario o correo" required>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
                <label for="passLogin" class="form-label">Contraseña</label>
                <div class="input-box">
                    <input type="password" id="passLogin" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>

            <!-- Mensaje de error por si fallan las credenciales -->
            <div id="errorLogin" class="alert alert-danger d-none py-2 text-center" role="alert">
                Usuario o contraseña incorrectos.
            </div>

            <button type="submit" class="btn btn-cafe-claro w-100 py-2 fs-5 mt-3">Iniciar Sesión</button>
            
            <div class="text-center mt-3">
                <span>¿No tienes cuenta? <a href="PeluCrearCuenta.html" class="text-white text-decoration-underline">Regístrate aquí</a></span>
            </div>
        </form>
    </div>

</body>
</html>
