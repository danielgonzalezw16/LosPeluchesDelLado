        <!-- PANEL EXCLUSIVO PARA ADMINISTRADOR -->
        <div id="panelAdminAgregar" class="container my-4 d-none">
            <div class="card p-4 border-0 shadow-sm" style="background-color: #ffe2c7;">
                <h4 class="text-pastel-cafe fw-bold mb-3">🛠️ Panel Admin: Agregar Nuevo Producto</h4>
                <form id="formAgregarProducto" onsubmit="guardarNuevoProducto(event)" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Nombre del Producto</label>
                        <input type="text" id="adminNombre" class="form-control" placeholder="Ej: Pikachu Gigante" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Categoría</label>
                        <select id="adminCategoria" class="form-select" required>
                            <option value="Anime">Anime</option>
                            <option value="Pokemon">Pokemon</option>
                            <option value="Sonic">Sonic</option>
                            <option value="Snoopys">Snoopys</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Precio ($)</label>
                        <input type="number" id="adminPrecio" class="form-control" placeholder="25000" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Ruta Imagen (Opcional)</label>
                        <input type="text" id="adminImagen" class="form-control" placeholder="../../PeluAssets/Peluches/eevee.png">
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-success fw-bold">➕ Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- CONTENEDOR DINÁMICO DE PRODUCTOS POR CATEGORÍA -->
        <div class="container my-5" id="contenedorCatalogo">
            <!-- Se llena dinámicamente con JS -->
        </div>

        <footer class="text-center pb-3 border-top pt-4">
            <p class="text-pastel-cafe fw-semibold m-0">Grupo 8 de Jóvenes Vendedores</p>
            <p class="text-muted small m-0">&copy; 2026 Lo Quieres, Te lo Vendo. Todos los Derechos Reservados</p>
        </footer>

        <script>
            // Base de datos de productos iniciales
            const productosSemilla = [
                { id: 1, categoria: "Anime", nombre: "Jujutsu kaisen - Yuji Itadori", precio: 26500, imagen: "../../PeluAssets/Peluches/Yuji Itadori.png", detalle: "detalle_itadori.html" },
                { id: 2, categoria: "Anime", nombre: "Jujutsu kaisen - Gojo Satoru", precio: 28000, imagen: "../../PeluAssets/Peluches/Gojo Satoru.png", detalle: "detalle_gojo.html" },
                { id: 3, categoria: "Pokemon", nombre: "Eevee", precio: 29000, imagen: "../../PeluAssets/Peluches/eevee.png", detalle: "detalle_eevee.html" },
                { id: 4, categoria: "Pokemon", nombre: "Snorlax", precio: 23000, imagen: "../../PeluAssets/Peluches/snorlax.png", detalle: "detalle_snorlax.html" },
                { id: 5, categoria: "Sonic", nombre: "Sonic Pequeño", precio: 10000, imagen: "../../PeluAssets/Peluches/sonic pequeño.png", detalle: "detalle_sonic.html" },
                { id: 6, categoria: "Sonic", nombre: "Shadow Batman", precio: 15000, imagen: "../../PeluAssets/Peluches/shadow Batman.png", detalle: "detalle_shadow.html" },
                { id: 7, categoria: "Snoopys", nombre: "Snoopy Rosa", precio: 25000, imagen: "../../PeluAssets/Peluches/snoopy rosa.png", detalle: "detalle_snoopy_rosa.html" },
                { id: 8, categoria: "Snoopys", nombre: "Snoopy el Piloto-Mecánico", precio: 29000, imagen: "../../PeluAssets/Peluches/snoopy mecanico.png", detalle: "detalle_snoopy_piloto.html" }
            ];

            function obtenerProductos() {
                let prods = JSON.parse(localStorage.getItem('productosDB'));
                if (!prods || prods.length === 0) {
                    localStorage.setItem('productosDB', JSON.stringify(productosSemilla));
                    return productosSemilla;
                }
                return prods;
            }

            function esAdmin() {
                const usuarioActivo = JSON.parse(localStorage.getItem('usuarioLogueado'));
                return usuarioActivo && (usuarioActivo.rol === "admin" || usuarioActivo.nombre === "Jadeicent" || usuarioActivo.nombre === "shadow");
            }

            function renderizarCatalogo() {
                const productos = obtenerProductos();
                const contenedor = document.getElementById('contenedorCatalogo');
                const esUsuarioAdmin = esAdmin();

                // Mostrar u ocultar panel de agregar según el rol
                const panelAdmin = document.getElementById('panelAdminAgregar');
                if (esUsuarioAdmin) {
                    panelAdmin.classList.remove('d-none');
                } else {
                    panelAdmin.classList.add('d-none');
                }

                const categorias = ["Anime", "Pokemon", "Sonic", "Snoopys"];
                let html = "";

                categorias.forEach(cat => {
                    const prodsCat = productos.filter(p => p.categoria === cat);
                    if (prodsCat.length > 0) {
                        html += `<h2 class="text-pastel-cafe fw-bold mb-4 border-bottom pb-2">${cat}</h2>`;
                        html += `<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mb-5">`;

                        prodsCat.forEach(prod => {
                            const imagenRuta = prod.imagen || '../../PeluAssets/Iconos/Logo.png';
                            html += `
                                <div class="col">
                                    <div class="card h-100 shadow-sm border-0 producto-card">
                                        <img src="${imagenRuta}" class="card-img-top p-3" alt="${prod.nombre}" style="height: 220px; object-fit: contain;" onerror="this.src='../../PeluAssets/Iconos/Logo.png'">
                                        <div class="card-body d-flex flex-column text-center">
                                            <h6 class="card-title text-pastel-cafe fw-bold">${prod.nombre}</h6>
                                            <p class="card-text text-success fw-bold fs-5 mt-auto">$${Number(prod.precio).toLocaleString('es-CL')}</p>
                                            <div class="d-flex justify-content-between gap-2 mt-2">
                                                <a href="${prod.detalle || '#'}" class="btn btn-sm btn-info-prod w-50">Ver info</a>
                                                <button class="btn btn-sm btn-add-cart w-50" onclick="agregarAlCarro('${prod.nombre}', ${prod.precio}, '${imagenRuta}')">Al Carro</button>
                                            </div>
                                            ${esUsuarioAdmin ? `
                                                <button class="btn btn-danger btn-sm mt-2 w-100 fw-bold" onclick="eliminarProductoAdmin(${prod.id})">
                                                    🗑️ Eliminar (Admin)
                                                </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }
                });

                contenedor.innerHTML = html;
            }

            // Función para agregar productos nuevos (Solo Admin)
            function guardarNuevoProducto(event) {
                event.preventDefault();
                const nombre = document.getElementById('adminNombre').value.trim();
                const categoria = document.getElementById('adminCategoria').value;
                const precio = Number(document.getElementById('adminPrecio').value);
                let imagen = document.getElementById('adminImagen').value.trim();

                if (!imagen) imagen = "../../PeluAssets/Iconos/Logo.png";

                const productos = obtenerProductos();
                const nuevoProd = {
                    id: Date.now(),
                    categoria,
                    nombre,
                    precio,
                    imagen,
                    detalle: "#"
                };

                productos.push(nuevoProd);
                localStorage.setItem('productosDB', JSON.stringify(productos));
                alert(`¡Producto "${nombre}" agregado con éxito!`);
                document.getElementById('formAgregarProducto').reset();
                renderizarCatalogo();
            }

            // Función para eliminar productos (Solo Admin)
            function eliminarProductoAdmin(id) {
                if (confirm("¿Estás seguro de que deseas eliminar este producto del catálogo?")) {
                    let productos = obtenerProductos();
                    productos = productos.filter(p => p.id !== id);
                    localStorage.setItem('productosDB', JSON.stringify(productos));
                    renderizarCatalogo();
                }
            }

            // Función original intacta para agregar al carro por usuario
            function agregarAlCarro(nombre, precio, rutaImagen) {
                const usuarioActivo = JSON.parse(localStorage.getItem('usuarioLogueado'));
                
                if (!usuarioActivo) {
                    alert('Debes iniciar sesión para agregar productos al carro.');
                    window.location.href = 'PeluIniciar.html';
                    return;
                }

                const claveCarrito = `carritoPeluches_${usuarioActivo.correo}`;
                const carrito = JSON.parse(localStorage.getItem(claveCarrito)) || [];
                
                const index = carrito.findIndex(prod => prod.nombre === nombre);
                if (index !== -1) {
                    carrito[index].cantidad = (carrito[index].cantidad || 1) + 1;
                } else {
                    carrito.push({ nombre: nombre, precio: precio, imagen: rutaImagen, cantidad: 1, seleccionado: true });
                }
                
                localStorage.setItem(claveCarrito, JSON.stringify(carrito));
                alert(`¡Se añadió "${nombre}" al Carro Exitosamente!`);
            }

            document.addEventListener('DOMContentLoaded', renderizarCatalogo);
        </script>

    </body>
